name: Migrate location English names

# slugMap.json 에 손으로 적어 둔 영어 이름을 운영 데이터(나라·지역)의 englishName 으로 한 번만 옮긴다.
# 그 뒤로는 관리자 화면에서 입력하므로 이 작업은 다시 돌릴 일이 없다.
# 관리자 키는 GitHub Secret(ADMIN_API_KEY)으로만 들어가며 레포에는 남지 않는다.
#
# 쓰는 법: Actions 탭 → 이 워크플로 → Run workflow
#   apply 를 비워 두면 "무엇이 바뀌는지" 만 보여 준다 (아무것도 저장 안 함).
#   확인한 뒤 apply 에 yes 를 넣고 다시 실행하면 저장한다.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: '비우면 미리 보기만. yes 를 넣으면 실제로 저장합니다'
        required: false
        type: string

run-name: ${{ inputs.apply == 'yes' && '지역 영어 이름 저장' || '지역 영어 이름 미리 보기' }}

concurrency: migrate-location-english-names

jobs:
  migrate:
    runs-on: ubuntu-latest
    # 저장할 때만 운영 금고를 연다
    environment: ${{ inputs.apply == 'yes' && 'production' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 미리 보기 (저장 안 함)
        if: inputs.apply != 'yes'
        run: node scripts/migrate-location-english-names.mjs

      - name: 저장
        if: inputs.apply == 'yes'
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: node scripts/migrate-location-english-names.mjs --apply

      - name: 원본 백업 보관
        if: inputs.apply == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: locations-backup
          path: locations-backup-*.json
          retention-days: 90
          if-no-files-found: warn
