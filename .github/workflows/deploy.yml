name: Deploy
# 실행 이름에 배포하는 커밋과 요청 번호를 넣어 TOURSTREAM OFFICE가 자기가 요청한 실행을 정확히 찾게 한다
# (같은 커밋을 여러 번 배포해도 요청 번호로 구분. 예약 실행은 요청 번호가 비어 있음)
# 예약 실행은 마지막 수동 배포 커밋을 다시 빌드하므로 main 최신 커밋 번호를 이름에 넣지 않는다
run-name: Deploy ${{ inputs.sha || ((github.event_name == 'schedule' || inputs.mode == 'rebuild-main') && 'scheduled-rebuild-of-last-approved') || github.sha }} ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: '배포할 커밋 (비우면 main 최신). OFFICE는 대표가 승인한 커밋을 넣는다'
        required: false
        type: string
      request_id:
        description: 'TOURSTREAM OFFICE가 배포마다 붙이는 고유 요청 번호 (실행 이름에만 쓰임, 비워도 됨)'
        required: false
        type: string
      # rebuild-main: 어드민에서 상품을 숨기거나 공개하면 운영 서버가 실행 (Actions 실행 권한만 있는 토큰).
      # 예약 실행과 같은 규칙으로 '마지막 승인 커밋'의 메인 사이트만 다시 빌드 — 관리자 화면·API 서버는 건드리지 않음
      mode:
        description: '비우면 일반 배포. rebuild-main = 마지막 승인 커밋으로 메인 사이트만 다시 빌드'
        required: false
        type: string
  # 매일 00:30 KST(15:30 UTC) - 가격/평점 배치가 끝난 직후 메인 사이트만 다시 빌드해서
  # 정적 셸의 가격·JSON-LD가 실제 가격과 하루 이상 벌어지지 않게 한다.
  schedule:
    - cron: '30 15 * * *'

# 배포는 한 번에 하나씩 (예약·수동이 겹쳐 오래된 버전이 나중에 덮어쓰지 않게). 진행 중인 배포는 끊지 않음
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  EC2_HOST: 43.201.66.181
  EC2_USER: ubuntu
  S3_BUCKET: tourstream-website-1758807132
  CLOUDFRONT_DISTRIBUTION_ID: E1MZSJK9IGD3MP

jobs:
  # 입력 확인: 정해진 조합만 허용 (다시 빌드에 커밋 입력 금지, 요청 번호 칸에 커밋 같은 값 금지, 모르는 mode 금지)
  validate:
    name: Validate inputs
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check inputs
        env:
          MODE: ${{ inputs.mode }}
          SHA: ${{ inputs.sha }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          case "$MODE" in ""|rebuild-main) ;; *) echo "모르는 mode: $MODE"; exit 1 ;; esac
          if [ "$MODE" = "rebuild-main" ] && { [ -n "$SHA" ] || [ -n "$REQUEST_ID" ]; }; then echo "다시 빌드는 커밋·요청 번호를 받지 않아요 (마지막 승인 배포 커밋만)"; exit 1; fi
          if [ -n "$SHA" ] && ! echo "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then echo "커밋 번호 형식이 아니에요"; exit 1; fi
          if [ -n "$REQUEST_ID" ] && ! echo "$REQUEST_ID" | grep -Eq '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then echo "요청 번호 형식이 아니에요"; exit 1; fi

  deploy-main:
    name: Deploy main site (S3 + CloudFront)
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # 예약 실행이 마지막 수동 배포 기록을 읽기 위해
    steps:
      # 예약 실행은 main 최신이 아니라 마지막으로 성공한 수동 배포의 커밋을 다시 빌드한다
      # (승인 없이 main에 들어온 코드가 밤사이 메인 사이트로 나가지 않게. 가격 최신화 목적은 그대로)
      - name: Pick last approved commit (schedule only)
        id: pick
        if: github.event_name == 'schedule' || inputs.mode == 'rebuild-main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 최근 수동 배포부터 보면서 '메인 사이트' 작업이 성공한 첫 실행의 커밋을 고른다
          # (전체는 실패했어도 메인은 성공한 배포 = 지금 메인 사이트에 올라가 있는 승인된 코드)
          sha=""
          # 실행 이름이 승인 배포 형식("Deploy <커밋 40자리>" 또는 "Deploy <커밋> <요청 번호>")인 실행만.
          # 다시 빌드 실행("Deploy scheduled-rebuild-…")은 승인 배포가 아니라서 건너뜀 (요청 번호 칸의 값은 보지 않음)
          for id in $(gh run list -R "$GITHUB_REPOSITORY" --workflow deploy.yml --event workflow_dispatch --status completed --limit 30 --json databaseId,displayTitle --jq '.[] | select(.displayTitle | test("^Deploy [0-9a-f]{40}( |$)")) | .databaseId'); do
            main=$(gh run view "$id" -R "$GITHUB_REPOSITORY" --json jobs --jq '[.jobs[] | select(.name | startswith("Deploy main site")) | .conclusion] | first // ""')
            if [ "$main" = "success" ]; then
              sha=$(gh run view "$id" -R "$GITHUB_REPOSITORY" --json displayTitle --jq '.displayTitle | capture("^Deploy (?<s>[0-9a-f]{40})").s')
              break
            fi
          done
          if ! echo "$sha" | grep -Eq '^[0-9a-f]{40}$'; then echo "메인 사이트가 성공한 수동 배포를 찾지 못해 예약 배포를 건너뜀"; exit 1; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          # 다시 빌드는 고른 승인 커밋만 (입력 커밋보다 우선 — 입력 확인에서도 막음). 그 밖엔 승인한 커밋만 배포
          ref: ${{ inputs.mode == 'rebuild-main' && steps.pick.outputs.sha || inputs.sha || steps.pick.outputs.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Build main (production)
        run: |
          # 이 빌드가 상품 목록을 읽은 시각 (그 전에 바뀐 숨김·공개는 이번 빌드에 반영됨 → 끝나면 서버에 '반영 완료' 알림)
          echo "FETCHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          npm run main:build:production

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync to S3
        run: |
          aws s3 sync packages/main/build/ s3://${{ env.S3_BUCKET }}/ --delete
          # HTML·사이트맵은 브라우저가 매번 새로 확인하게 (숨긴 상품 페이지가 브라우저 저장본으로 남지 않게)
          aws s3 cp packages/main/build/ s3://${{ env.S3_BUCKET }}/ --recursive --exclude "*" --include "*.html" --include "sitemap.xml" \
            --metadata-directive REPLACE --cache-control "no-cache"

      - name: Invalidate CloudFront cache (and wait until done)
        run: |
          id=$(aws cloudfront create-invalidation --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*" --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} --id "$id"

      # CDN 무효화까지 끝나야 '숨김 반영 완료' (그 전에는 어드민에 '숨김 반영 중'). 알림 키가 없으면 건너뜀 (반영 중으로 남음)
      - name: Report visibility sync done
        env:
          SYNC_KEY: ${{ secrets.VISIBILITY_SYNC_KEY }}
        run: |
          if [ -z "$SYNC_KEY" ]; then echo "VISIBILITY_SYNC_KEY 없음 — 알리지 않음"; exit 0; fi
          curl -fsS -X POST https://api.tourstream.kr/api/admin/visibility-synced \
            -H "x-visibility-sync-key: $SYNC_KEY" -H 'Content-Type: application/json' \
            -d "{\"fetchedAt\":\"$FETCHED_AT\",\"runId\":\"$GITHUB_RUN_ID\"}"

  deploy-admin:
    name: Deploy admin site (EC2 static)
    # 예약 실행은 가격 최신화가 목적이라 메인 사이트만 배포한다 (admin/API 코드는 안 바뀜)
    if: github.event_name != 'schedule' && inputs.mode != 'rebuild-main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 승인한 커밋이 있으면 그 커밋만 배포 (그사이 main이 바뀌어도 다른 코드가 나가지 않게)
          ref: ${{ inputs.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Build admin (production)
        run: npm run build:production --workspace=packages/admin

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Upload build to server
        run: rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key" packages/admin/build/ ${{ env.EC2_USER }}@${{ env.EC2_HOST }}:/var/www/admin/

  deploy-api:
    name: Deploy API (EC2 + PM2)
    if: github.event_name != 'schedule' && inputs.mode != 'rebuild-main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 승인한 커밋이 있으면 그 커밋만 배포 (그사이 main이 바뀌어도 다른 코드가 나가지 않게)
          ref: ${{ inputs.sha || github.sha }}

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Upload server code (data/logs/config on server are preserved)
        run: |
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key" \
            --exclude 'data' \
            --exclude 'logs' \
            --exclude 'backups' \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude 'ecosystem.config.cjs' \
            --exclude 'ecosystem.config.js' \
            packages/server/ ${{ env.EC2_USER }}@${{ env.EC2_HOST }}:/var/www/api/

      - name: Install deps and reload PM2
        run: |
          # ecosystem.config.cjs를 넘겨야 서버에서 새로 추가한 환경변수가 반영됨 (앱 이름으로만 reload하면 무시됨)
          ssh -i ~/.ssh/deploy_key ${{ env.EC2_USER }}@${{ env.EC2_HOST }} "cd /var/www/api && npm install --omit=dev && pm2 reload ecosystem.config.cjs --update-env"
